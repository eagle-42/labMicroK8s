name: ci
on: [push, pull_request]

# The token can read the repository and nothing else.
permissions:
  contents: read

# A newer push makes the previous run pointless: stop it rather than pay for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so the pipeline is reproducible, and so it tests the version the lab runs.
  MICROK8S: 1.36/stable
  KUBECONFORM: 0.8.0
  KUBESCAPE: 4.0.12
  PLUTO: 5.24.3
  GITLEAKS: 8.30.1
  KUBECTL: v1.36.4
  PRE_COMMIT: 4.6.2

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to a commit, not a tag: a tag can be moved, a commit cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0            # gitleaks scans the history
          persist-credentials: false

      # Downloaded binaries are verified against the checksums their authors publish.
      # A release asset can be replaced; an unverified download runs whatever arrives.
      - name: Install what the local hook needs
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          kc="https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM}"
          ks="https://github.com/kubescape/kubescape/releases/download/v${KUBESCAPE}"

          curl -sSLO "$kc/kubeconform-linux-amd64.tar.gz"
          curl -sSL "$kc/CHECKSUMS" | grep ' kubeconform-linux-amd64.tar.gz$' | sha256sum -c -
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform

          bin="kubescape_${KUBESCAPE}_linux_amd64"
          curl -sSLO "$ks/$bin"
          curl -sSL "$ks/checksums.sha256" | grep " $bin\$" | sha256sum -c -
          mv "$bin" kubescape

          gl="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS}"
          tgz="gitleaks_${GITLEAKS}_linux_x64.tar.gz"
          curl -sSLO "$gl/$tgz"
          curl -sSL "$gl/gitleaks_${GITLEAKS}_checksums.txt" | grep " $tgz\$" | sha256sum -c -
          tar xzf "$tgz" gitleaks

          # scripts/manifests.sh calls `kubectl kustomize`; without this the lint job
          # inherited whatever the runner image happened to ship.
          kc_url="https://dl.k8s.io/release/${KUBECTL}/bin/linux/amd64/kubectl"
          curl -sSLO "$kc_url"
          echo "$(curl -sSL "$kc_url.sha256")  kubectl" | sha256sum -c -

          pl="https://github.com/FairwindsOps/pluto/releases/download/v${PLUTO}"
          tgz="pluto_${PLUTO}_linux_amd64.tar.gz"
          curl -sSLO "$pl/$tgz"
          curl -sSL "$pl/checksums.txt" | grep " $tgz\$" | sha256sum -c -
          tar xzf "$tgz" pluto

          chmod +x kubeconform kubescape pluto gitleaks kubectl
          sudo mv kubeconform kubescape pluto gitleaks kubectl /usr/local/bin/

      - run: pipx install "pre-commit==${PRE_COMMIT}"
      - run: pre-commit run --all-files

      # The pinned hook runs `gitleaks --staged`, and under `--all-files` the index
      # is empty: it scans zero commits and always passes. The history is what
      # fetch-depth: 0 was fetched for, so it is scanned here, once, for real.
      - name: A credential that reached the history stays there
        run: gitleaks git --redact --exit-code 1 .

  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The same channel the lab installs, so CI cannot pass on a Kubernetes the
      # lab never runs.
      - name: Bring up MicroK8s
        run: |
          set -euo pipefail
          sudo snap install microk8s --classic --channel="${MICROK8S}"
          sudo microk8s status --wait-ready --timeout 300
          sudo microk8s enable rbac dns storage
          sudo microk8s status --wait-ready --timeout 300

      # The addon ships a Traefik the lab does not run. The same script the install
      # runs, so the pipeline cannot pass against an ingress nobody serves with.
      - name: Bring the ingress to the pinned Traefik
        run: sudo bash 00-install/traefik.sh

      - name: Apply the baseline, then each module
        run: |
          set -euo pipefail
          make -C 00-install deploy
          sudo microk8s kubectl wait --for=create serviceaccount/default -n labs --timeout=90s
          make -C 01-pods deploy
          make -C 02-services deploy

      # The point of the repo: the controls are proven by trying to break them.
      - run: make -C 00-install security-check
      - run: make -C 01-pods security-check
      - run: make -C 02-services security-check

      # The gates above assert the controls hold. These assert the gates can fail:
      # without them the repo's central claim is the one thing CI never checks.
      - run: make -C 00-install test
      - run: make -C 01-pods test
      - run: make -C 02-services test
