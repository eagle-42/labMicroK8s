apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
spec:
  # 'public' is the class 00-install declares as default, in traefik-values.yaml.
  ingressClassName: public
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello
                port:
                  number: 80
