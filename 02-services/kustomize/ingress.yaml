apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
spec:
  # 'public' is the class the addon installs by default, and it survived the switch
  # from NGINX to Traefik in MicroK8s 1.35.
  ingressClassName: public
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello
                port:
                  number: 80
