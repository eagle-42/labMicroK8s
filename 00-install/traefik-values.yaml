# Traefik for the lab: a DaemonSet on the node's ports 80 and 443, one IngressClass,
# and a dashboard published on neither of them.
deployment:
  kind: DaemonSet

ports:
  web:
    port: 8000
    exposedPort: 80
    hostPort: 80
  websecure:
    port: 8443
    exposedPort: 443
    hostPort: 443

# A surge pod lands on the node it replaces, so it can never bind a hostPort the old
# one still holds. Free the port first.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

# `traefik` is the entrypoint with no hostPort: the dashboard is reached by tunnel,
# not by sending a Host header to the node.
ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`dashboard.localhost`)
    entryPoints:
      - traefik

providers:
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true
  kubernetesGateway:
    enabled: false

ingressClass:
  enabled: true
  isDefaultClass: true
  name: public
